<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
    <div class="container">
        <h1>Calculator</h1>
       <div class="box">
         <div class="screen">
              <p class="para">0</p>
         </div>
         <div class="Num_box">
            <div class="Operator_box">
                <button class="add opr">+</button>
                <button class="sub  opr">-</button>
                <button class="mul  opr">*</button>
                <button class="divide opr">/</button>
            </div>
            <div class="row-1">
                <button class="num">1</button>
                <button class="num">2</button>
                <button class="num">3</button>
            </div>
           <div class="row-2">
               <button class="num">4</button>
                <button class="num">5</button>
                <button class="num">6</button>
           </div>
           <div class="row-3">
            <button class="num">7</button>
            <button class="num">8</button>
            <button class="num">9</button>
           </div>
           <div class="equal">
            <button><p>=</p></button>
           
           </div>
           
         <div class="clear"><button class="reset">AC</button>
        <button class="reset delete">DEL</button></div>
       </div>
     
    </div>
    
    </section>
    <script src="index.js"></script>
</body>
</html>
